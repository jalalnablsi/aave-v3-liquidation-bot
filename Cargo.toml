[package]
name = "grim-reaper-x"
version = "1.0.0"
edition = "2021"

[dependencies]
# الخيار 'full' يضمن تضمين جميع الميزات اللازمة لأداء مثالي
alloy = { version = "0.8.3", features = ["full"] }
alloy-sol-types = "0.8"
tokio = { version = "1.35", features = ["full", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenv = "0.15"
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0"
dashmap = "5.5"
futures-util = "0.3"
csv = "1.3"
chrono = "0.4"
hex = "0.4"
anyhow = "1.0"
hex-literal = "0.4"
lru = "0.16.3"
rand = "0.10.1"
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
lru = "0.12"
rand = "0.8"
